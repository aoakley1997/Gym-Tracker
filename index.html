<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><link rel="manifest" href="./manifest.webmanifest"><title>Gym Tracker</title><style>body{font:16px system-ui;background:#0d1421;color:#f4f6fa;margin:0}main{max-width:620px;margin:auto;padding:20px}h1{margin:8px 0}p,small{color:#aab5c7}.card{background:#192538;border:1px solid #34445b;border-radius:16px;padding:16px;margin:12px 0}button,input{font:inherit;border-radius:9px;padding:10px;border:1px solid #56647a}button{background:#283951;color:white;cursor:pointer}button.active,.primary{background:#b7f25a;color:#10200a;border-color:#b7f25a;font-weight:bold}input{width:65px;background:#101827;color:white;box-sizing:border-box}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.set{display:grid;grid-template-columns:36px 78px 78px 1fr;gap:8px;align-items:center;margin:10px 0}.set button{width:100%}.muted{color:#aab5c7}#clock{font-size:32px;font-weight:700}progress{width:100%;accent-color:#b7f25a}button:focus-visible,input:focus-visible{outline:2px solid #b7f25a}.hero{padding:20px;border-radius:20px;background:linear-gradient(135deg,#253b54,#172439 60%,#284332);margin-bottom:16px}.hero h1{font-size:30px;letter-spacing:-1px}.hero p{margin-bottom:0}.card{box-shadow:0 8px 24px #050a1240}.card b{font-size:17px}.demo{margin:12px 0 3px}.demo summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:7px;color:#b7f25a;font-weight:650;font-size:14px;padding:8px 0}.demo summary::-webkit-details-marker{display:none}.demo iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#0d1421}.demo a{color:#b7f25a;display:inline-block;margin:8px 0}.tip{font-size:12px;color:#b4c2d3;line-height:1.5}.set button{min-height:43px}#workouts .card{border-left:3px solid #b7f25a}@media(max-width:380px){.set{grid-template-columns:28px 64px 64px 1fr;gap:5px}.set input{width:62px}} </style></head><body><main><div class="hero"><small style="color:#b7f25a;font-weight:700;letter-spacing:2px">YOUR TRAINING SPACE</small><h1>Gym Tracker<span style="color:#b7f25a">.</span></h1><p>Stronger, one set at a time.</p></div><div class="row"><button id="d0" class="active">Day 1</button><button id="d1">Day 2</button><span id="count"></span></div><progress id="bar" value="0" max="1"></progress><section class="card"><div class="row"><div><small>REST TIMER</small><div id="clock">01:00</div></div><button id="pause">Start</button><button id="reset">Reset</button></div><small>Completing a set starts a 60-second countdown.</small></section><div id="workouts"></div><button id="save" class="primary">Save workout</button> <button id="clear">Clear day</button><section class="card"><b>History</b><div id="history"></div></section><p><small>Only perform exercises cleared by your clinician. Keep your back supported and stop if pain occurs. Data is stored in this browser, not synced between devices.</small></p></main><script>
const demos={
'Stationary bike':{q:'stationary bike gym setup exercise tutorial',tip:'Stay comfortable and upright; use an easy pace.'},
'Chest press machine':{q:'chest press machine proper form tutorial',tip:'Keep your back against the pad; avoid arching.'},
'Lat pulldown':{q:'lat pulldown machine proper form tutorial',tip:'Stay upright without leaning or jerking backwards.'},
'Leg press':{q:'seated leg press machine proper form tutorial',tip:'Only if cleared by your clinician. Use light resistance and avoid rounding your lower back or bringing knees too close to your chest.'},
'Seated dumbbell lateral raises':{video:'g_7iXXBrCkY',q:'seated dumbbell lateral raise proper form',tip:'Sit with back support, use light weights and avoid swinging.'},
'Supported bicep curls':{q:'preacher curl machine bicep curl tutorial',tip:'Use a preacher or supported curl; avoid torso movement.'},
'Pec deck / chest fly':{q:'pec deck machine chest fly tutorial',tip:'Keep your back against the seat and move smoothly.'},
'Chest-supported row':{q:'chest supported seated row machine tutorial',tip:'Keep your chest against the pad throughout.'},
'Seated tricep machine':{q:'seated triceps extension machine tutorial',tip:'Use a seated, supported machine and avoid straining.'}
};
const plans=[[['Stationary bike',0,0],['Chest press machine',3,10],['Lat pulldown',3,10],['Leg press',2,12],['Seated dumbbell lateral raises',2,12],['Supported bicep curls',2,12]],[['Stationary bike',0,0],['Pec deck / chest fly',3,10],['Chest-supported row',3,10],['Leg press',2,12],['Seated tricep machine',2,12],['Supported bicep curls',2,12]]];
let day=0,db={sets:{},history:[]},seconds=60,timer=null;try{const old=JSON.parse(localStorage.getItem('gym-tracker-v1'));if(old&&old.sets&&Array.isArray(old.history))db=old}catch(e){}
const $=id=>document.getElementById(id),key=(i,s)=>day+'-'+i+'-'+s,store=()=>localStorage.setItem('gym-tracker-v1',JSON.stringify(db));
function tick(){seconds=Math.max(0,seconds-1);clock();if(seconds===0){stop();if(navigator.vibrate)navigator.vibrate([200,100,200])}}
function clock(){$('clock').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
function stop(){clearInterval(timer);timer=null;$('pause').textContent='Start'}
function start(){stop();timer=setInterval(tick,1000);$('pause').textContent='Pause'}
function element(tag,cls,text){let x=document.createElement(tag);x.className=cls||'';if(text!==undefined)x.textContent=text;return x}
function render(){ $('d0').classList.toggle('active',day===0);$('d1').classList.toggle('active',day===1);let total=0,done=0;const area=$('workouts');area.replaceChildren();plans[day].forEach(([name,sets,reps],i)=>{const card=element('section','card');card.append(element('b','',name),element('p','',sets?sets+' × '+reps:'5 min warm-up'));const info=demos[name];if(info){const details=element('details','demo'),summary=element('summary','','▶ Watch exercise demo');details.append(summary);const content=element('div');if(info.video){const frame=element('iframe');frame.title=name+' exercise demonstration';frame.loading='lazy';frame.referrerPolicy='strict-origin-when-cross-origin';frame.allow='accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture';frame.allowFullscreen=true;details.addEventListener('toggle',()=>{if(details.open&&!frame.src)frame.src='https://www.youtube-nocookie.com/embed/'+info.video});content.append(frame)}const link=element('a','',info.video?'Open video on YouTube ↗':'Find demonstration videos on YouTube ↗');link.href=info.video?'https://www.youtube.com/watch?v='+info.video:'https://www.youtube.com/results?search_query='+encodeURIComponent(info.q);link.target='_blank';link.rel='noopener noreferrer';content.append(link,element('div','tip',info.tip));details.append(content);card.append(details)}if(!sets){let b=element('button','',db.sets[key(i,'warm')]?'✓ Warm-up done':'Mark warm-up done');b.onclick=()=>{db.sets[key(i,'warm')]=!db.sets[key(i,'warm')];store();render()};card.append(b)}else{let header=element('div','set muted');['Set','kg','Reps','Done'].forEach(t=>header.append(element('span','',t)));card.append(header);for(let s=0;s<sets;s++){total++;const k=key(i,s),v=db.sets[k]||{kg:'',reps:String(reps),done:false};if(v.done)done++;const row=element('div','set');row.append(element('span','',String(s+1)));for(const field of ['kg','reps']){let input=element('input');input.type='number';input.min='0';input.step=field==='kg'?'0.5':'1';input.value=v[field]??'';input.setAttribute('aria-label',name+' set '+(s+1)+' '+field);input.onchange=()=>{db.sets[k]={...(db.sets[k]||v),[field]:input.value};store()};row.append(input)}let btn=element('button',v.done?'primary':'',v.done?'✓':'○');btn.setAttribute('aria-label','Toggle set '+(s+1));btn.onclick=()=>{let current=db.sets[k]||v;const complete=!current.done;db.sets[k]={...current,done:complete};store();if(complete){seconds=60;clock();start()}render()};row.append(btn);card.append(row)}}area.append(card)});$('count').textContent=done+' / '+total+' sets';$('bar').max=total||1;$('bar').value=done;const history=$('history');history.replaceChildren();if(!db.history.length)history.append(element('p','muted','No workouts saved yet'));db.history.slice(-10).reverse().forEach(h=>history.append(element('p','',h.date+' · '+h.day+' · '+h.sets+' sets')))}
$('d0').onclick=()=>{day=0;render()};$('d1').onclick=()=>{day=1;render()};$('pause').onclick=()=>timer?stop():start();$('reset').onclick=()=>{stop();seconds=60;clock()};$('save').onclick=()=>{let done=0;plans[day].forEach((e,i)=>{for(let s=0;s<e[1];s++)if(db.sets[key(i,s)]?.done)done++});if(!done){alert('Tick at least one set first');return}db.history.push({date:new Date().toLocaleDateString('en-AU'),day:'Day '+(day+1),sets:done});store();render();alert('Workout saved')};$('clear').onclick=()=>{if(!confirm('Clear this day?'))return;Object.keys(db.sets).filter(k=>k.startsWith(day+'-')).forEach(k=>delete db.sets[k]);store();render()};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});clock();render();
</script></body></html>
